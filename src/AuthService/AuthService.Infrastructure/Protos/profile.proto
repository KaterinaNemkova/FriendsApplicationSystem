syntax = "proto3";

option csharp_namespace = "UserService.GrpcServer";

service UserProfileService {
  rpc CreateProfile (CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfileIdByUserId (GetProfileIdRequest) returns (GetProfileIdResponse);
}

message CreateProfileRequest {
  string user_id = 1;
  string user_name = 2;
}

message CreateProfileResponse {
  bool success = 1;
}

message GetProfileIdRequest{
  string userId = 1;
}

message GetProfileIdResponse{
  string profileId = 1;
}